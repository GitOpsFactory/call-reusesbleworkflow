name: Payment Service Deployment

on:

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  grand-central-deploy:

    uses: Grand-Central/platform-workflows/.github/workflows/aws-deploy.yml@v1.0.0

    with:
      aws-region: ap-south-1
      environment: production

    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}